# Cloudflare Worker serving an Xtream Codes compatible API for IPTV Nexus.
# Deploy:  npx wrangler deploy   (see README.md in this folder)
name = "iptv-nexus-xtream"
main = "worker.js"
compatibility_date = "2026-01-01"

[vars]
# The GitHub Pages site the Worker reads xtream/index.json from.
NEXUS_ORIGIN = "https://dearbulut.github.io/iptv"
# Optional: require this password. Prefer a secret over a plain var:
#   npx wrangler secret put XTREAM_PASSWORD

# Regional availability ("where does this channel work?") is stored in D1.
# The binding must be called DB — that is the name the Worker looks for.
# The table is created automatically on first use. For a fork, create your
# own with `npx wrangler d1 create iptv-nexus` and put its id here.
[[d1_databases]]
binding = "DB"
database_name = "iptv-nexus"
database_id = "441a33b2-5d51-4065-81be-5def679dfc1c"
