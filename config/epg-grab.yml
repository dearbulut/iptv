# EPG sites to grab with the iptv-org/epg grabber.
#
# The `EPG Grab` workflow clones https://github.com/iptv-org/epg, runs its
# scraper for each site below in its own parallel job, and publishes the
# resulting XMLTV to this repository's `state` branch. `config/epg-sources.yml`
# then reads those files back in during the normal sync.
#
# Grabbing ourselves — rather than pointing at somebody else's EPG dump — is
# deliberate: third-party aggregator dumps are exactly the kind of source
# docs/LEGAL.md warns about, and a first-party scrape of a broadcaster's own
# public listings is defensible.
#
# Choosing sites:
#   `mapped` below is how many of a site's channels already carry an
#   `xmltv_id` in the upstream database, i.e. how many link to a Nexus channel
#   with no guessing at all. Our matcher fuzzy-matches the rest, but a site
#   with a high mapped ratio is worth far more per minute of grabbing.
#
# Sites deliberately NOT enabled:
#   ontvtonight.com  17478 channels,  2% mapped — huge grab, almost no yield
#   tv24.co.uk        1072 channels,  4% mapped — same problem, smaller
#   epgshare01.online / epg.iptvx.one / sat.tv — third-party EPG dumps rather
#     than first-party listings; excluded on the same grounds as stream sources
#
# Full catalogue: https://github.com/iptv-org/epg/blob/master/SITES.md

sites:
  # --- United States -------------------------------------------------------
  - site: tvtv.us
    lang: en
    countries: [US, CA]
    # 2299 channels, 97% already mapped — the single best source available.
    # Disabled 2026-11: returned 2299 channels and 0 programmes on every run —
    # the site does not serve listings to GitHub runners.
    enabled: false
    timeout: 30000
    max_connections: 10

  # --- Free ad-supported streaming (matches most of our stream sources) ----
  - site: pluto.tv
    lang: en
    countries: [US, GB, DE, ES, FR, IT, BR, MX, CA, AU]
    # 2696 channels, 30% mapped. A large share of our streams are Pluto feeds.
    enabled: true
    timeout: 30000
    max_connections: 10

  - site: plex.tv
    lang: en
    countries: [US, GB, CA, AU]
    # 1315 channels, 42% mapped.
    enabled: true
    timeout: 30000
    max_connections: 10

  # i.mjh.nz is deliberately NOT grabbed here: that host publishes finished
  # XMLTV for Samsung TV Plus, Pluto and Plex directly, so scraping it through
  # the grabber would spend an hour rebuilding a file we can just download.
  # See the matching entries in config/epg-sources.yml.

  # --- Türkiye -------------------------------------------------------------
  - site: tvplus.com.tr
    lang: tr
    countries: [TR]
    # 150 channels, 96% mapped.
    enabled: true
    timeout: 30000
    max_connections: 5

  - site: digiturk.com.tr
    lang: tr
    countries: [TR]
    # 112 channels, 81% mapped.
    # Disabled 2026-11: produced no usable guide on any run, and would add
    # EPG to only 2 currently-live channels we do not already cover.
    enabled: false
    timeout: 30000
    max_connections: 5

  - site: turksatkablo.com.tr
    lang: tr
    countries: [TR]
    # 177 channels, 67% mapped.
    # Disabled 2026-11: produced no usable guide on any run, and would add
    # EPG to only 9 currently-live channels we do not already cover.
    enabled: false
    timeout: 30000
    max_connections: 5

  # --- Latin America / Spain ----------------------------------------------
  - site: mi.tv
    lang: es
    countries: [MX, AR, CL, CO, PE, VE, ES]
    # 2084 channels, 29% mapped.
    enabled: true
    timeout: 30000
    max_connections: 8

  # --- Poland --------------------------------------------------------------
  - site: programtv.onet.pl
    lang: pl
    countries: [PL]
    # 590 channels, 60% mapped.
    enabled: true
    timeout: 30000
    max_connections: 5

  # --- Added 2026-11 to close the largest coverage gaps --------------------
  # Chosen by *marginal* gain: how many currently-live channels each site adds
  # that no already-enabled source covers. Live channels with a guide before
  # these: 19.0%. Measured gain, in order (cumulative coverage in brackets):
  #   tataplay.com +378 (23.8%)  tv.mail.ru +203 (26.3%)  programetv.ro +89
  #   (27.4%)  superguidatv.it +43 (28.0%)  dishtv.in +31 (28.3%)
  #   movistarplus.es +19 (28.8%)
  # Rejected for low marginal gain: airtelxstream.in +20 (overlaps the Indian
  # sites above), orangetv.orange.es +3, guidatv.sky.it +3. jiotv.com lists
  # 1094 channels but none carry an xmltv_id, so it matches nothing.
  #
  # Sites hosted in India or Russia may refuse GitHub's US runners the way
  # tvtv.us did. That is safe: an empty grab is skipped and reported in the
  # workflow summary. If one stays empty for a week, disable it here.

  - site: tataplay.com
    lang: en
    countries: [IN]
    # 905 channels; +378 live channels gain EPG.
    enabled: true
    timeout: 30000
    max_connections: 6

  - site: dishtv.in
    lang: en
    countries: [IN]
    # 637 channels; +31 beyond tataplay.
    enabled: true
    timeout: 30000
    max_connections: 6

  - site: tv.mail.ru
    lang: ru
    countries: [RU, BY, KZ]
    # 520 channels; +203 live channels gain EPG.
    enabled: true
    timeout: 30000
    max_connections: 6

  - site: programetv.ro
    lang: ro
    countries: [RO, MD]
    # 331 channels; +89 — Romania had no EPG at all before this.
    enabled: true
    timeout: 30000
    max_connections: 5

  - site: superguidatv.it
    lang: it
    countries: [IT]
    # 204 channels; +43.
    enabled: true
    timeout: 30000
    max_connections: 5

  - site: movistarplus.es
    lang: es
    countries: [ES]
    # 143 channels; +19.
    enabled: true
    timeout: 30000
    max_connections: 5
