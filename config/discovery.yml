# Automatic discovery sources.
#
# `mode: index`    — fetch the page and follow every .m3u/.m3u8 link it contains
# `mode: playlist` — treat the URL itself as a playlist
#
# Discovery NEVER writes to the dataset directly. It produces a proposal
# (.data/proposals/discovered.m3u + .md) that CI turns into a pull request for
# a human to review. Only add sources you have the right to index.

sources:
  - id: iptv-org-index
    name: iptv-org country index
    url: https://iptv-org.github.io/iptv/index.country.m3u
    enabled: true
    mode: playlist
    trust: 0.8

  - id: iptv-org-categories
    name: iptv-org category index
    url: https://iptv-org.github.io/iptv/index.category.m3u
    enabled: true
    mode: playlist
    trust: 0.8

  # Free-TV/IPTV: strictly free, officially provided channels only (DVB-T/S,
  # Samsung TV Plus, Pluto, Plex, Roku, YouTube live), marks geo-blocked feeds.
  # Measured 2026-11-17 against our index: 1192 URLs we do not have, 1127 of
  # them matching a channel we already index, 540 giving a first stream to a
  # channel that currently has none (before the live probe).
  #
  # DISABLED pending the owner's decision: the repository publishes no licence,
  # so its compilation is all-rights-reserved by default. Discovery does not
  # republish the list -- it takes individual URLs of official free streams,
  # probes each one, and records "free-tv" as provenance in the API -- but it
  # is the owner's call whether that is acceptable. Set enabled: true to use it.
  - id: free-tv
    name: Free-TV/IPTV
    url: https://raw.githubusercontent.com/Free-TV/IPTV/master/playlist.m3u8
    enabled: false
    mode: playlist
    trust: 0.7

  # - id: community-index
  #   name: A community index page listing public playlists
  #   url: https://example.com/free-iptv-lists
