# Stream sources.
#
# The baseline is our own database in data/: data/iptv-org (a copy of the
# iptv-org database, synced nightly) plus data/nexus (our own channels,
# community streams, corrections and takedowns). The `iptv-org` entry below only
# sets the trust weight of the mirrored streams; community streams get 0.6.
#
# To add your own list, append an entry with a unique `id` and a public M3U URL.
# `trust` (0-1) biases ranking when the same channel appears in several lists.
#
# Only add sources you have the right to redistribute. See docs/LEGAL.md.

sources:
  - id: iptv-org
    name: iptv-org community database
    type: iptv-org
    url: https://iptv-org.github.io/api
    enabled: true
    trust: 0.9
    license: The Unlicense
    homepage: https://github.com/iptv-org/iptv

  # Streams found by the nightly discovery run and auto-accepted: each one
  # matched a channel we already index and answered a live probe. Trust is low
  # so a curated list always outranks them, and health scoring retires them
  # like any other stream if they stop responding.
  - id: discovered
    name: Auto-discovered streams
    type: m3u
    url: https://raw.githubusercontent.com/dearbulut/iptv/main/config/discovered.m3u
    enabled: true
    trust: 0.35

  # FAST-service mirrors (Pluto TV, Samsung TV Plus, Plex) are deliberately
  # not listed: the best-known ones were taken down by DMCA notice in 2024.

  # --- Example of a filtered, country-pinned source -------------------------
  # - id: my-local-list
  #   name: My curated local channels
  #   type: m3u
  #   url: https://example.com/my-channels.m3u
  #   enabled: false
  #   trust: 0.8
  #   country: TR
  #   exclude: "(?i)adult|xxx"
